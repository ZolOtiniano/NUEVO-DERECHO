<section class="py-5 bg-success text-white">

    <div class="container-fluid text-center">

        {% if pagina.hero.imagen %}

        <img
            src="{{ pagina.hero.imagen.url }}"
            alt="{{ pagina.titulo }}"
            class="img-fluid hero-img"
            loading="eager"
            decoding="async"
        >

        {% endif %}

    </div>

</section>

<style>
.hero-img{
    width:100%;
    max-height:450px;
    object-fit:cover;
    border-radius:12px;
}
</style>
