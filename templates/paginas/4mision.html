<section class="mision-section py-5">

    <div class="container">


        <!-- Encabezado -->
        <div class="section-header text-center mb-5">

            {% for encabezado in pagina.encabezados.all %}

                {% if encabezado.seccion == "mision" %}

                    <h2 class="fw-bold">
                        {{ encabezado.titulo }}
                    </h2>

                    <p class="text-muted col-lg-7 mx-auto">
                        {{ encabezado.descripcion }}
                    </p>

                {% endif %}

            {% endfor %}

        </div>



        <div class="row justify-content-center">

            <div class="col-lg-9">


                <div class="mision-box">


                    <div class="icon-box">

                        <i class="bi bi-bullseye"></i>

                    </div>



                    <p>
                        {{ pagina.mision.descripcion }}
                    </p>


                </div>


            </div>

        </div>


    </div>

</section>

<style>
    .mision-section{
    background:#ffffff;
}



.mision-box{

    position:relative;

    background:#f8f9fa;

    padding:70px 60px 50px;

    text-align:center;

    border-radius:30px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.08);

    border-top:5px solid #198754;

}



.icon-box{

    width:100px;

    height:100px;

    background:#198754;

    color:white;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:-120px auto 35px;

    box-shadow:
    0 10px 25px rgba(25,135,84,.35);

}



.icon-box i{

    font-size:3rem;

}



.mision-box p{

    color:#555;

    font-size:1.2rem;

    line-height:2;

    margin:0;

}



@media(max-width:768px){

    .mision-box{

        padding:60px 25px 35px;

    }


    .mision-box p{

        font-size:1rem;

    }

}
</style>
