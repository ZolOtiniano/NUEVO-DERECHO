<section class="vision-section py-5">

    <div class="container">


        <!-- Encabezado -->
        <div class="section-header text-center mb-5">

            {% for encabezado in pagina.encabezados.all %}

                {% if encabezado.seccion == "vision" %}

                    <h2 class="fw-bold">
                        {{ encabezado.titulo }}
                    </h2>

                    <p class="text-muted col-lg-7 mx-auto">
                        {{ encabezado.descripcion }}
                    </p>

                {% endif %}

            {% endfor %}

        </div>



        <div class="row justify-content-center">

            <div class="col-lg-9">


                <div class="vision-box">


                    <!-- Icono -->
                    <div class="vision-icon">

                        <i class="bi bi-eye-fill"></i>

                    </div>



                    <!-- Contenido -->
                    <p>
                        {{ pagina.vision.descripcion }}
                    </p>


                </div>


            </div>

        </div>


    </div>

</section>

<style>
.vision-section{
    background:#ffffff;
}



.vision-box{

    position:relative;

    background:#f8f9fa;

    padding:70px 60px 50px;

    text-align:center;

    border-radius:30px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.08);

    border-top:5px solid #0d6efd;

}



.vision-icon{

    width:100px;

    height:100px;

    background:#0d6efd;

    color:white;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:-120px auto 35px;

    box-shadow:
    0 10px 25px rgba(13,110,253,.35);

}



.vision-icon i{

    font-size:3rem;

}



.vision-box p{

    color:#555;

    font-size:1.2rem;

    line-height:2;

    margin:0;

}



@media(max-width:768px){

    .vision-box{

        padding:60px 25px 35px;

    }


    .vision-box p{

        font-size:1rem;

    }

}

</style>
