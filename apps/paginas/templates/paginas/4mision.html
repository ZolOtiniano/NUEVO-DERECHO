<section class="mision-section py-5">

    <div class="container">


        <!-- Encabezado -->
        <div class="section-header text-center mb-5">

            {% for encabezado in pagina.encabezados.all %}

                {% if encabezado.seccion == "mision" %}


                    <span class="section-badge">
                        Identidad Institucional
                    </span>


                    <h2 class="fw-bold">
                        {{ encabezado.titulo }}
                    </h2>


                    <p class="text-muted col-lg-7 mx-auto">
                        {{ encabezado.descripcion }}
                    </p>


                {% endif %}

            {% endfor %}

        </div>




        <div class="row justify-content-center">

            <div class="col-lg-9">


                <div class="mision-box">


                    <div class="icon-box">

                        <i class="bi bi-bullseye"></i>

                    </div>



                    <div class="mision-texto">

                        {{ pagina.mision.descripcion|linebreaks }}

                    </div>


                    <div class="mision-linea"></div>


                </div>


            </div>


        </div>


    </div>


</section>

<style>
    .mision-section{

    background:#fff;

}



/* etiqueta */

.section-badge{

    display:inline-block;

    background:#198754;

    color:white;

    padding:6px 18px;

    border-radius:30px;

    font-size:.85rem;

    margin-bottom:15px;

}



/* caja */

.mision-box{

    position:relative;

    background:#f8f9fa;

    padding:80px 60px 50px;

    text-align:center;

    border-radius:30px;

    box-shadow:

    0 20px 45px rgba(0,0,0,.10);

    border-top:5px solid #198754;

}



/* icono */

.icon-box{

    width:110px;

    height:110px;

    background:#198754;

    color:white;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:-135px auto 35px;

    box-shadow:

    0 15px 35px rgba(25,135,84,.35);

    transition:.3s;

}


.icon-box:hover{

    transform:translateY(-8px);

}



.icon-box i{

    font-size:3.2rem;

}



/* texto */

.mision-texto{

    color:#555;

    font-size:1.2rem;

    line-height:2;

    text-align:justify;

}



/* línea */

.mision-linea{

    width:100px;

    height:4px;

    background:#198754;

    margin:35px auto 0;

    border-radius:20px;

}



@media(max-width:768px){


    .mision-box{

        padding:70px 25px 35px;

    }


    .icon-box{

        width:90px;

        height:90px;

        margin-top:-120px;

    }


    .icon-box i{

        font-size:2.5rem;

    }


    .mision-texto{

        font-size:1rem;

    }

}
</style>
