<section id="valores" class="valores-section py-5">

    <div class="container">


        <!-- Encabezado -->
        <div class="section-header text-center mb-5">

            {% for encabezado in pagina.encabezados.all %}

                {% if encabezado.seccion == "valores" %}

                    <h2 class="fw-bold">
                        {{ encabezado.titulo }}
                    </h2>

                    <p class="text-muted mx-auto" style="max-width:700px;">
                        {{ encabezado.descripcion }}
                    </p>

                {% endif %}

            {% endfor %}

        </div>



        <div class="row g-4">


            {% for valor in pagina.valores.all %}


            <div class="col-lg-4 col-md-6">


                <div class="valor-card">


                    <div class="valor-icono">

                        <i class="bi bi-award-fill"></i>

                    </div>



                    <h4>
                        {{ valor.titulo }}
                    </h4>



                    <p>
                        {{ valor.descripcion }}
                    </p>


                </div>


            </div>


            {% endfor %}


        </div>


    </div>

</section>



<style>
.valores-section{

    background:#f8f9fa;

}



.valor-card{

    position:relative;

    background:#fff;

    height:100%;

    padding:45px 30px;

    text-align:center;

    border-radius:25px;

    border-bottom:5px solid #198754;

    box-shadow:
    0 10px 30px rgba(0,0,0,.07);

    transition:.35s ease;

}



.valor-card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 20px 45px rgba(0,0,0,.13);

}



.valor-icono{

    width:90px;

    height:90px;

    margin:0 auto 25px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#198754;

    color:white;

    border-radius:50%;

    font-size:2.2rem;

    box-shadow:
    0 10px 25px rgba(25,135,84,.35);

}



.valor-card h4{

    font-weight:700;

    color:#212529;

    margin-bottom:15px;

}



.valor-card p{

    color:#6c757d;

    line-height:1.8;

    font-size:1rem;

}

</style>
